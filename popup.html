<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Coordinate Click</title>
  <style>
    body {
      width: 360px;
      max-height: 580px;
      overflow: auto;
      padding: 12px;
      font: 13px system-ui, sans-serif
    }

    label {
      display: block;
      margin: 7px 0
    }

    input:not([type=checkbox]),
    select {
      box-sizing: border-box;
      width: 100%;
      padding: 5px
    }

    button {
      padding: 7px;
      cursor: pointer
    }

    button.primary {
      width: 100%;
      margin-top: 8px
    }

    .rule {
      border: 1px solid #aaa;
      border-radius: 8px;
      padding: 10px;
      margin: 12px 0
    }

    .line {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px
    }

    .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px
    }

    .hint {
      color: #777;
      font-size: 11px
    }

    #status {
      white-space: pre-wrap
    }
  </style>
</head>

<body>
  <h3>Manual click / grid sweep</h3>
  <form id="manual">
    <div class="line"><label>X<input name="x" type="number" min="0" value="295" required></label><label>Y<input name="y"
          type="number" min="0" value="355" required></label></div>
    <label>Grid size<select name="gridSize" class="sizes"></select></label>
    <div class="line"><label>Spacing (px)<input name="step" type="number" min="1" max="100" value="10"
          required></label><label>Delay (ms)<input name="intervalMs" type="number" min="80" max="5000" value="180"
          required></label></div>
    <label><input type="checkbox" name="visualize" checked> Show click markers</label>
    <button class="primary" type="submit">Click / Sweep</button>
  </form>
  <hr>
  <div class="bar">
    <h3>Automatic rules</h3><button id="add" type="button">+ Add rule</button>
  </div>
  <p class="hint">Each enabled rule requires both a URL substring and a page text substring. Fires once per page load.
    Runs in all accessible frames.</p>
  <div id="rules"></div>
  <p id="status" role="status"></p>
  <template id="rule-template">
    <section class="rule">
      <div class="bar"><label><input name="enabled" type="checkbox" checked> Enabled</label><button type="button"
          class="remove">Remove</button></div>
      <label>URL contains<input name="urlMatch" type="text" placeholder="example.com/path"></label>
      <label>Page text contains<input name="textMatch" type="text" placeholder="Ready to continue" value="Performing security verification"></label>
      <div class="line"><label>X<input name="x" type="number" min="0" value="623"></label><label>Y<input name="y"
            type="number" min="0" value="400"></label></div>
      <label>Grid size<select name="gridSize" class="sizes"></select></label>
      <div class="line"><label>Spacing (px)<input name="step" type="number" min="1" max="100"
            value="10"></label><label>Delay (ms)<input name="intervalMs" type="number" min="80" max="5000"
            value="180"></label></div>
      <label><input name="visualize" type="checkbox" checked> Show markers</label>
      <button type="button" class="save primary">Save rules</button>
    </section>
  </template>
  <script src="popup.js"></script>
</body>

</html>
