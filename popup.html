<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Coordinate Click</title>
  <style>
    body { width: 300px; padding: 14px; font: 13px system-ui, sans-serif; }
    label { display: block; margin: 8px 0; }
    input, select { width: 100%; box-sizing: border-box; padding: 6px; }
    button { margin-top: 8px; width: 100%; padding: 8px; }
    #status { white-space: pre-wrap; overflow-wrap: anywhere; }
    small { color: #777; }
  </style>
</head>
<body>
  <strong>Viewport coordinate clicks</strong>
  <form id="form">
    <label>X <input id="x" type="number" value="345" min="0" step="any" required></label>
    <label>Y <input id="y" type="number" value="417" min="0" step="any" required></label>
    <label>Pattern <select id="radius">
      <option value="0">Single click</option>
      <option value="1" selected>3 × 3 (9 clicks)</option>
      <option value="2">5 × 5 (25 clicks)</option>
      <option value="3">7 × 7 (49 clicks)</option>
    </select></label>
    <label>Spacing (px) <input id="step" type="number" value="10" min="1" max="100" step="1" required></label>
    <label>Pause between clicks (ms) <input id="interval" type="number" value="180" min="80" max="5000" step="1" required></label>
    <label><input id="visualize" type="checkbox" checked style="width:auto"> Show click crosshair and coordinates</label>
    <button type="submit">Click / Sweep</button>
  </form>
  <p><small>Starts at the center, then surrounding points. Each click can activate page controls; use carefully.</small></p>
  <hr>
  <strong>Automatic rule (URL AND page text)</strong>
  <p><small>Runs once per page load when both conditions match. Searches permitted frames and open shadow DOM.</small></p>
  <form id="auto-form">
    <label><input id="autoEnabled" type="checkbox" style="width:auto"> Enable automatic clicking</label>
    <label>Page URL contains <input id="urlMatch" type="text" placeholder="example.com/path" required></label>
    <label>Page text contains <input id="textMatch" type="text" placeholder="Your target phrase" required></label>
    <label>Auto X <input id="autoX" type="number" value="345" min="0" required></label>
    <label>Auto Y <input id="autoY" type="number" value="417" min="0" required></label>
    <label>Auto pattern <select id="autoRadius">
      <option value="0">Single click</option><option value="1" selected>3 × 3</option>
      <option value="2">5 × 5</option><option value="3">7 × 7</option>
    </select></label>
    <label>Spacing (px) <input id="autoStep" type="number" value="10" min="1" max="100" required></label>
    <label>Pause (ms) <input id="autoInterval" type="number" value="180" min="80" max="5000" required></label>
    <label><input id="autoVisualize" type="checkbox" checked style="width:auto"> Show click markers</label>
    <button type="submit">Save automatic rule</button>
    <p id="autoStatus" role="status"></p>
  </form>
  <p id="status" role="status"></p>
  <script src="popup.js"></script>
</body>
</html>
